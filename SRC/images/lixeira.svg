<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  Ícone de lixeira em SVG
  viewBox 736x736: mesma proporção da imagem de referência.
  Estilo: traço (stroke) branco com cantos arredondados, sem preenchimento.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="736" height="736" viewBox="0 0 736 736" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>


  <!-- Grupo com os traços em comum: cor, espessura e pontas arredondadas -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">

    <!-- Alça da tampa: retângulo com cantos arredondados (rx) -->
    <rect x="318" y="178" width="100" height="50" rx="14"/>

    <!-- Tampa: retângulo largo e arredondado (rx=25 deixa as pontas em formato de pílula) -->
    <rect x="217" y="229" width="301" height="50" rx="25"/>

    <!-- Corpo da lixeira: caminho (path) com cantos inferiores curvos feitos por curvas quadráticas (Q) -->
    <!-- M = move para o ponto inicial | L = linha reta | Q = curva com ponto de controle -->
    <path d="M242 292 L242 517 Q242 557 282 557 L453 557 Q493 557 493 517 L493 292"/>

    <!-- Linhas internas verticais: cada uma vai de y=355 até y=505 -->
    <line x1="305" y1="355" x2="305" y2="505"/>
    <line x1="368" y1="355" x2="368" y2="505"/>
    <line x1="431" y1="355" x2="431" y2="505"/>

  </g>
</svg>
